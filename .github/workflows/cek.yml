name: Günlük Maç Çekici

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Kütüphaneyi Kur
        run: pip install requests
      - name: Script'i Çalıştır
        run: python maclari_cek.py
      - name: JSON Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: mac-listesi
          path: maclar_*.json
